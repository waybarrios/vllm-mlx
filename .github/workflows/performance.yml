name: Apple Silicon performance

on:
  pull_request:
    branches: [main]
    paths:
      - "vllm_mlx/**"
      - "scripts/performance_ci/**"
      - "tests/test_performance_ci*.py"
      - "pyproject.toml"
      - ".github/workflows/performance.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark coverage
        type: choice
        options: [quick, nightly]
        default: quick

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired-performance:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: ${{ github.workspace }}/.performance-models
    steps:
      - name: Check out candidate and benchmark harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Select immutable baseline
        id: refs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline="${PR_BASE_SHA:-$(git -C candidate rev-parse HEAD^)}"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || exit 1
          printf 'base=%s\n' "$baseline" >> "$GITHUB_OUTPUT"

      - name: Check out baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.refs.outputs.base }}
          path: baseline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"

      - name: Install one shared pinned runtime
        run: |
          python -m pip install --no-cache-dir \
            -c candidate/scripts/performance_ci/requirements.txt \
            -r candidate/scripts/performance_ci/requirements.txt \
            -e candidate
          python -m pip check

      - name: Run sequential paired measurements
        env:
          PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.profile || 'quick' }}
        run: |
          python candidate/scripts/performance_ci/controller.py \
            --base baseline --head candidate --profile "$PROFILE" \
            --output performance-results

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f performance-results/summary.md ]; then
            cat performance-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Benchmark setup failed before measurements. See job logs.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain raw measurements and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-silicon-performance-${{ github.run_attempt }}
          path: performance-results/
          retention-days: 7
          if-no-files-found: warn
