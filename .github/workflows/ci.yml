name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff
        run: ruff check vllm_mlx/ tests/ --select E,F,W --ignore E402,E501,E731,F811,F841

      - name: Run black
        run: black --check vllm_mlx/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic fastapi

      - name: Run mypy
        run: mypy vllm_mlx/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio pytest-cov pydantic fastapi jsonschema httpx psutil transformers requests

      - name: Run unit tests (no MLX required)
        run: |
          pytest \
            tests/test_mcp_security.py \
            tests/test_structured_output.py \
            tests/test_reasoning_parser.py \
            tests/test_tool_parsers.py \
            tests/test_streaming_json_encoder.py \
            tests/test_native_tool_format.py \
            tests/test_memory_cache.py \
            tests/test_prefix_cache.py \
            tests/test_mllm_cache.py \
            tests/test_api_models.py \
            tests/test_api_utils.py \
            tests/test_request.py \
            tests/test_anthropic_models.py \
            tests/test_anthropic_adapter.py \
            tests/test_dependency_floors.py \
            tests/test_ssd_cache_shutdown.py \
            tests/test_chat_template_safety.py \
            tests/test_simple_engine_thread_pinning.py \
            tests/test_engine_base.py \
            tests/test_harmony_parsers.py \
            tests/test_endpoint_model_policies.py \
            tests/test_truncation.py \
            tests/test_cli_arg_types.py \
            tests/test_gemma4_openai_format.py \
            tests/test_gemma4_streaming_edge.py \
            tests/test_gemma4_tool_parser.py \
            tests/test_deepseek_v4_encoding.py \
            tests/test_deepseek_v4_reasoning.py \
            tests/test_deepseek_v4_tool_parser.py \
            tests/test_minimax_tool_calling.py \
            tests/test_qwen3_xml_parser.py \
            tests/test_qwen3_xml_registration.py \
            tests/test_qwen3_xml_streaming_chunks.py \
            tests/test_qwen35_mtp_hidden_state_mode.py \
            tests/test_streaming_fence_stripper.py \
            tests/test_streaming_think_router.py \
            tests/test_streaming_tool_filter.py \
            tests/test_tool_call_promotion.py \
            -v --tb=short \
            -k "not Integration and not InjectJson and not TestMLXMultimodalLMCache" \
            --cov=vllm_mlx \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-python-3-14:
    # Focused job for the CPython 3.14+ asyncio.shield() behavior change
    # that shield_task() (vllm_mlx/engine/base.py) works around -- the
    # regular test-matrix only covers 3.10-3.13, none of which reproduce it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest anyio pytest-cov

      - name: Run engine base tests
        run: |
          pytest tests/test_engine_base.py -v --tb=short

  test-apple-silicon:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision,harmony]"

      - name: Verify Apple Silicon
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', 'Not ARM64'"
          python -c "import mlx.core as mx; print(f'MLX OK: {mx.default_device()}')"

      - name: Run MLX-dependent tests
        run: |
          pytest \
            tests/test_platform.py \
            tests/test_llm.py \
            tests/test_mllm.py \
            tests/test_server.py \
            tests/test_paged_cache.py \
            tests/test_prefix_cache_untrimmable.py \
            tests/test_scheduler_max_kv_size.py \
            tests/test_qwen35_mtp_patch.py \
            tests/test_batched_engine_mllm_config.py \
            tests/test_mllm_continuous_batching.py \
            tests/test_mllm_cache.py \
            tests/test_optimizations.py \
            tests/test_simple_engine.py \
            tests/test_simple_engine_prefix_trie_cache.py \
            tests/test_text_model_dispatch.py \
            tests/test_cli.py \
            tests/test_model_registry.py \
            tests/test_chat_template_kwargs.py \
            tests/test_batching.py \
            tests/test_continuous_batching.py \
            tests/test_memory_cache_mlx.py \
            tests/test_mllm_ssd_spill.py \
            tests/test_ssd_cache.py \
            tests/test_ssd_shutdown_wiring.py \
            tests/test_lifecycle_cli.py \
            tests/test_lifecycle_server.py \
            tests/test_normalize_messages.py \
            tests/test_responses_api.py \
            tests/test_thinking_aware_processor.py \
            tests/test_tool_choice_forced.py \
            tests/test_tool_choice_none.py \
            tests/test_harmony_render.py \
            tests/test_embeddings.py \
            tests/test_rerank.py \
            -v --tb=short \
            -m "not slow" \
            -k "not Integration"

      - name: Run streaming text-with-tool-calls regression tests
        run: |
          # Kept out of the list above because that invocation filters with
          # -k "not Integration", which would deselect the endpoint file by
          # name and silently skip every regression in it.
          pytest \
            tests/test_streaming_content_with_tool_calls.py \
            tests/test_streaming_content_with_tool_calls_integration.py \
            -v --tb=short \
            -m "not slow"

      - name: Run EngineCore stream-affinity regression tests
        run: |
          # Fresh process so globals like mlx_lm.generate.generation_stream
          # are not rebound by earlier tests (see issue #407).
          pytest \
            tests/test_batching_deterministic.py \
            tests/test_batched_engine_owner_thread.py \
            tests/test_engine_core_idle_polling.py \
            tests/test_engine_core_stream_safety.py \
            tests/test_engine_core_thread_streams.py \
            -v --tb=short \
            -m "not slow" \
            -k "not Integration"

  tests:
    needs: [test-matrix, test-python-3-14, test-apple-silicon]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.test-python-3-14.result }}" != "success" ]; then
            echo "Python 3.14 tests failed"
            exit 1
          fi
          if [ "${{ needs.test-apple-silicon.result }}" != "success" ]; then
            echo "Apple Silicon tests failed"
            exit 1
          fi
